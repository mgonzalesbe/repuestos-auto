# RepuestosAuto — Render Blueprint (web only)
# Dashboard: New → Blueprint → connect this GitHub repo → apply.
# Postgres is external (Neon). Paste DATABASE_URL in the Render dashboard
# (Environment → DATABASE_URL). Prefer Neon's pooled connection string.
# Free web has no preDeployCommand; migrations run in buildCommand (idempotent).
# postgres:// / postgresql:// are normalized to postgresql+psycopg:// in app/config.py.

services:
  - type: web
    name: repuestos-auto
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    startCommand: gunicorn -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      # Set manually in Render → Environment (Neon URI). Not linked to a Render DB.
      - key: DATABASE_URL
        sync: false
