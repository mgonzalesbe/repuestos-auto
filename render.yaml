# RepuestosAuto — Render Blueprint
# Dashboard: New → Blueprint → connect this GitHub repo → apply.
# Free web has no preDeployCommand; migrations run in buildCommand (idempotent).

services:
  - type: web
    name: repuestos-auto
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python scripts/migrate.py
    startCommand: gunicorn -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: repuestos-auto-db
          property: connectionString

databases:
  - name: repuestos-auto-db
    plan: free
    databaseName: repuestos
    user: repuestos
    postgresMajorVersion: "16"
    ipAllowList: [] # Internal access only (web service in same region)
